name: Build Unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List available Xcodes
        run: ls -d /Applications/Xcode*.app 2>/dev/null || echo "no xcodes found"

      - name: Use latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator UDID
        id: simulator
        run: |
          UDID=$(python3 - <<'PY'
          import json
          import subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in sorted(data["devices"].items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator found")
          PY
          )
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID: $UDID"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project Wallhaven.xcodeproj \
            -scheme Wallhaven \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcodebuild test-without-building \
            -project Wallhaven.xcodeproj \
            -scheme Wallhaven \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Build archive (no signing)
        run: |
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "Building with iOS SDK $SDK_VERSION"
          xcodebuild archive \
            -project Wallhaven.xcodeproj \
            -scheme Wallhaven \
            -configuration Release \
            -archivePath ./build/Wallhaven.xcarchive \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R ./build/Wallhaven.xcarchive/Products/Applications/Wallhaven.app ./Payload/
          zip -r -y Wallhaven-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wallhaven-unsigned.ipa
          path: Wallhaven-unsigned.ipa
          retention-days: 7
